<h2>Add Product</h2>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
  <label>
    Name:
    <input formControlName="name" class="border border-gray-200 shadow-sm rounded-sm p-1" />
  </label>
  <div *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched">
    Name is required.
  </div>

  <label>
    Price:
    <input type="number" formControlName="price" class="border border-gray-200 shadow-sm rounded-sm p-1" />
  </label>
  <div *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched">
    Price must be at least 1.
  </div>

  <label>
    Description:
    <textarea formControlName="description" class="border border-gray-200 shadow-sm rounded-sm p-1"></textarea>
  </label>

  <button type="submit" [disabled]="productForm.invalid">Save</button>
</form>
